# Front del campus en producción: estado HTTP 404 real para las direcciones que no existen.
# Plantilla para el bloque `server` de campus.evenor-tech.com (no es el archivo completo: el proxy de
# /api y el TLS siguen como estén). Sustituye al fallback `try_files $uri /index.html;`, que devolvía
# 200 en cualquier ruta (soft 404).
#
# · Rutas de la SPA (la misma lista que vite/knownRoutes.js) → index.html con 200.
# · Cualquier otra página → index.html con 404: la app pinta la página «fuera de órbita».
# · Archivos que no existen (un chunk de un despliegue viejo, una imagen) → 404 sin cuerpo HTML.
# Las 404 quedan en el access log de nginx: ahí se ven los enlaces rotos sin datos personales extra.

root /ruta/al/dist;   # la que ya use el servidor

location ~ "^/(reset-password|forgot-password|login|contacto|cursos|reseñas|ajustes|sobre|cookies|politica-cookies|privacidad|terminos|aviso-legal|guia-usuario|admin/correcciones|curso/[^/]+(/(inscripcion|invitacion|estructura|tema-estudio|temario/[^/]+|ejercicio/[^/]+/entregar))?)?/?$" {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

location /assets/ {
    try_files $uri =404;
}

location / {
    try_files $uri =404;
    error_page 404 /404.html;
}

# El documento de la página 404 es el mismo index.html; `internal` evita que /404.html se pida directo
location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}
